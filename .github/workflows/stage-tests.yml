name: stage-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep this pinned, never "latest": "latest" can resolve to a
          # golangci-lint built with an older Go toolchain than go.mod's Go
          # 1.26, which it then refuses to run against. v2.13.2 is built with a
          # Go 1.26.x toolchain. The action's v7 dropped golangci-lint v1 and
          # its v8 requires >= v2.1.0, so v2.13.2 satisfies v9 as well and
          # still matches this repo's `version: "2"` .golangci.yml.
          version: v2.13.2
      # `make all` treats unformatted code as a failure, and nothing else in CI
      # checks it, so a gofmt drift would only surface on a developer's machine.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

  unit:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest executes the named pipe, job object and DACL'd paths
        # that CI otherwise only cross-compiles. The POSIX assumptions that
        # used to make this job meaningless are gone: process spawns go
        # through a helper-process TestMain, sockets are dialled through
        # platform.DialControl, and the assertions with no Windows equivalent
        # yet (owner-only file modes, sun_path length) are guarded and name
        # the gap. Until this passes once, every Windows behaviour in
        # SECURITY.md is declared, not enforced.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - run: go vet ./...
      # The race detector is not optional here: the run, steer and control
      # packages are concurrent, and their bugs do not reproduce without it
      # (CLAUDE.md, "Commands").
      - run: go test -race ./...
