name: ci

on:
  # The default branch only. A bare `push:` matches tag pushes too, and
  # release.yml runs these same four stage workflows for a tag, so every tag ran
  # the whole pipeline twice. Every other branch is covered by pull_request:
  # listing both here would run each PR commit twice instead.
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run in flight
# pointless, so cancel it. Deliberately absent from release.yml: cancelling a
# publish half-way is worse than paying for the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One pipeline, five stages, in this order: security, tests, compile, smoke,
# release. Each stage is a reusable workflow whose jobs run in parallel; the
# stages themselves are sequential, so a leaked secret stops the run before
# anything is compiled and a failing test stops it before anything is published.
# release.yml calls the same four stage workflows in the same order and adds the
# release stage on top, so a tag cannot take a shortcut past a check a pull
# request has to pass.
jobs:
  security:
    uses: ./.github/workflows/stage-security.yml

  tests:
    needs: security
    uses: ./.github/workflows/stage-tests.yml

  compile:
    needs: tests
    uses: ./.github/workflows/stage-compile.yml

  # The vendor half of the smoke stage installs the pinned CLIs from npm, so it
  # runs nightly and on manual dispatch rather than on every push. The rest of
  # the stage always runs: it needs no network beyond the checkout.
  smoke:
    needs: compile
    uses: ./.github/workflows/stage-smoke.yml
    with:
      vendor_clis: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  # Conformance runs real vendor CLIs, so it needs credentials and spends money.
  # It is nightly and manual only: a pull request from a fork must never be able
  # to trigger it. A flag that is merely accepted proves nothing; these tests
  # assert behaviour, which is the only thing that catches a vendor changing
  # what a flag means. It sits after the smoke stage rather than inside it
  # because it is the one job here that cannot run without secrets.
  conformance:
    needs: smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: vendor-clis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: install vendor CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.272 @openai/codex@0.154.0
      # Without credentials the vendor CLIs answer 401 / "Not logged in", which
      # fails some of these tests and — worse — passes others for the wrong
      # reason: a run that never reached a model also never writes the file
      # TestCodexReadOnlyRefusesAWrite looks for. So the credentials are
      # checked first, and BRIDGE_CONFORMANCE is only set when both are
      # present; without them every test skips on its existing gate and the
      # step warns instead of asserting a property nothing verified. Populate
      # ANTHROPIC_API_KEY and OPENAI_API_KEY in the `vendor-clis` environment
      # to arm the suite.
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$OPENAI_API_KEY" ] || missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning title=conformance not run::vendor credentials missing in the vendor-clis environment:$missing. The suite proves nothing this run."
          else
            export BRIDGE_CONFORMANCE=1
          fi
          go test ./conformance/ -v -timeout 30m
