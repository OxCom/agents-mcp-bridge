name: ci

on:
  # The default branch only. A bare `push:` matches tag pushes too, and
  # release.yml runs these same four stage workflows for a tag, so every tag ran
  # the whole pipeline twice. Every other branch is covered by pull_request:
  # listing both here would run each PR commit twice instead.
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run in flight
# pointless, so cancel it. Deliberately absent from release.yml: cancelling a
# publish half-way is worse than paying for the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One pipeline, five stages, in this order: security, tests, compile, smoke,
# release. Each stage is a reusable workflow whose jobs run in parallel; the
# stages themselves are sequential, so a leaked secret stops the run before
# anything is compiled and a failing test stops it before anything is published.
# release.yml calls the same four stage workflows in the same order and adds the
# release stage on top, so a tag cannot take a shortcut past a check a pull
# request has to pass.
jobs:
  security:
    uses: ./.github/workflows/stage-security.yml

  tests:
    needs: security
    uses: ./.github/workflows/stage-tests.yml

  compile:
    needs: tests
    uses: ./.github/workflows/stage-compile.yml

  # The vendor half of the smoke stage installs the pinned CLIs from npm, so it
  # runs nightly and on manual dispatch rather than on every push. The rest of
  # the stage always runs: it needs no network beyond the checkout.
  smoke:
    needs: compile
    uses: ./.github/workflows/stage-smoke.yml
    with:
      vendor_clis: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
