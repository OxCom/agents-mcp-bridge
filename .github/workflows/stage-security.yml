name: stage-security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Secret scanning runs before anything else compiles: a leaked credential in
  # history is worth knowing about even if the build is broken.
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan walks git history, which a shallow clone does not contain.
          fetch-depth: 0
      # Pinned to a release tag rather than @main because an action that reads
      # the whole repository is a supply-chain surface of its own: @main would
      # let an upstream compromise run here without any change on our side.
      - uses: trufflesecurity/trufflehog@v3.97.4
        with:
          path: ./
          extra_args: --results=verified,unknown

  # A second scanner with a different rule set: the two disagree often enough
  # that running only one leaves a class of secrets unseen.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks reads the working tree here, but history stays available
          # for a future switch to `gitleaks git`.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # gitleaks/gitleaks-action is deliberately avoided: since v2 it demands a
      # GITLEAKS_LICENSE secret for organization-owned repositories, which makes
      # the scan fail for reasons that have nothing to do with the code. The CLI
      # is the same scanner without the licence gate, installed the way this
      # repo already installs gosec and govulncheck.
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          # --redact keeps a matched secret out of the public workflow log,
          # which is world-readable for a public repository.
          gitleaks dir . --redact --no-banner

  # The dependency audit. govulncheck reports only vulnerabilities reachable
  # from this module's own call graph, so a finding here is actionable rather
  # than a version-range alert against code nothing calls.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Static analysis of this repo's own code, complementing the dependency audit
  # above: gosec catches the sink, govulncheck catches the supply chain.
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated ./...
