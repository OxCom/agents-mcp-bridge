name: stage-smoke

on:
  workflow_call:
    inputs:
      vendor_clis:
        description: Install the pinned vendor CLIs from npm and smoke them.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # This job proves the binary builds and boots, that the loader and its semantic
  # rules run, and that the platform paths resolve on all three supported
  # operating systems. It needs no vendor CLI, no credentials and no model
  # invocation. Windows is the one that proves something new: its seams have
  # never been executed anywhere else in CI.
  doctor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - if: runner.os != 'Windows'
        run: go build -o bridge ./cmd/bridge
      - name: doctor against a minimal config
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/minimal.yaml" <<'EOF'
          version: 1
          allowed_roots: [/tmp]
          agents:
            demo:
              command: /bin/echo
              tier: basic
              mode: read-only
              sandbox:
                read-only: ["--safe"]
              invoke:
                args: ["run"]
          EOF
          # Loader rule 12 rejects a config file that is group- or world-writable,
          # so the permissions have to be tightened before bridge reads it.
          chmod 600 "$RUNNER_TEMP/minimal.yaml"
          # The adapter command is /bin/echo rather than /bin/cat because doctor
          # probes each adapter with `<command> --version`, and BSD cat on macOS
          # exits non-zero for --version while echo exits 0 on both platforms.
          ./bridge doctor --host claude --config "$RUNNER_TEMP/minimal.yaml"

      # Windows runs the same probe through its own seams: %LOCALAPPDATA% paths
      # with a DACL instead of 0700 directories, and a config the loader will
      # not vouch for. Config permission checking is unimplemented there
      # (internal/config/perm_windows.go, v1.1), so the loader refuses every
      # file; --insecure-skip-permission-check is the only way to exercise the
      # loader and the semantic rules on Windows at all, and doctor prints a
      # WARN line whenever it is used.
      - name: build (Windows)
        if: runner.os == 'Windows'
        run: go build -o bridge.exe ./cmd/bridge
      - name: doctor against a minimal config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The adapter command is a copy of the bridge binary: `bridge
          # --version` exits 0, so the probe needs no vendor CLI and no PATH
          # lookup, and the copied name keeps it clear of self-exclusion.
          $agent = Join-Path $env:RUNNER_TEMP 'demo-agent.exe'
          Copy-Item .\bridge.exe $agent
          $cfg = Join-Path $env:RUNNER_TEMP 'minimal.yaml'
          # Single-quoted YAML scalars: backslashes in a Windows path are not
          # escapes there.
          @"
          version: 1
          allowed_roots: ['$env:RUNNER_TEMP']
          agents:
            demo:
              command: '$agent'
              tier: basic
              mode: read-only
              sandbox:
                read-only: ["--safe"]
              invoke:
                args: ["run"]
          "@ | Set-Content -Path $cfg -Encoding utf8
          .\bridge.exe doctor --host claude --config $cfg --insecure-skip-permission-check

  # The specification and the implementation must not drift: every complete YAML
  # example in the docs is loaded by the real loader, semantic rules included.
  spec-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - run: go test ./internal/config/ -run TestDocumentedExamplesLoad -v

  # Gated because it installs from the npm network on every run, which belongs on
  # a schedule or a release rather than on every push. It still spends no vendor
  # credits and needs no secrets: doctor invokes no model.
  vendor-pins:
    if: inputs.vendor_clis
    strategy:
      fail-fast: false
      matrix:
        # Windows is here to pin the opposite outcome: npm installs both CLIs
        # as .cmd shims, which the loader refuses (semantics.go, "script
        # launcher"), and that refusal is the documented reason Windows support
        # is v1.1. The job asserts the refusal, so it goes red the day the
        # shape changes in either direction.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # The supported versions: codex-cli 0.154.0 is the binary every spike ran
      # against (docs/12-spike-results.md:3), and claude 2.1.272 is the newer of
      # the two claude builds spiked, the one that produced the interactive-mode
      # results C7-C9 (:8 and :11). Bumping either pin means re-running the
      # spikes, per docs/12-spike-results.md:18.
      - name: install pinned vendor CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.272 @openai/codex@0.154.0
      # The npm tag could resolve to something else than the pin the spike
      # results were observed against; assert the actual binaries, not the
      # install command.
      - name: assert pinned versions
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # Captured first, not piped: `--version | grep -q` can leave the
          # writer killed by SIGPIPE, which pipefail then turns into a failure
          # on a version that actually matched.
          claude_v=$(claude --version)
          codex_v=$(codex --version)
          case "$claude_v" in *2.1.272*) ;; *) echo "claude pin mismatch: $claude_v"; exit 1 ;; esac
          case "$codex_v" in *0.154.0*) ;; *) echo "codex pin mismatch: $codex_v"; exit 1 ;; esac
      - name: assert pinned versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $claudeV = (claude --version | Out-String)
          $codexV = (codex --version | Out-String)
          if ($claudeV -notmatch '2\.1\.272') { throw "claude pin mismatch: $claudeV" }
          if ($codexV -notmatch '0\.154\.0') { throw "codex pin mismatch: $codexV" }
      - if: runner.os != 'Windows'
        run: go build -o bridge ./cmd/bridge
      # doctor reports config, paths, adapters and host detection without
      # invoking a model, so it spends no vendor credits.
      - name: doctor
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # examples/config.yaml ships the documented allowed_roots, which no
          # runner has. doctor is right to call a missing root a fault, so the
          # fixture is what has to exist.
          mkdir -p ~/projects
          ./bridge doctor --host claude --config examples/config.yaml
          ./bridge doctor --host codex --config examples/config.yaml

      - name: build (Windows)
        if: runner.os == 'Windows'
        run: go build -o bridge.exe ./cmd/bridge
      # The inverse assertion: on Windows both pinned CLIs install as .cmd
      # shims and the loader must refuse them. --insecure-skip-permission-check
      # is needed to reach that rule at all, because config permission checking
      # is unimplemented on Windows and refuses first (v1.1).
      - name: doctor refuses the npm shims (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\projects" | Out-Null
          $out = (.\bridge.exe doctor --host claude --config examples/config.yaml `
                    --insecure-skip-permission-check 2>&1 | Out-String)
          # Captured immediately: the pwsh wrapper GitHub appends ends the step
          # with `exit $LASTEXITCODE`, so a refusal this job EXPECTS would
          # otherwise fail the step after both assertions passed.
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) {
            throw "doctor accepted an npm-installed CLI on Windows; the .cmd shim must be refused (v1.1)"
          }
          if ($out -notmatch 'script launcher') {
            throw "doctor failed for some other reason than the shim refusal"
          }
          Write-Host "doctor refused the npm .cmd shim, as v1.1 requires"
          exit 0
