name: stage-compile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Every release target must compile from the first commit, so the platform
  # seams cannot rot while the Windows port stays deferred to roadmap phase 5a.
  # Windows is build-and-unit-test only until that port lands.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
