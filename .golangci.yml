version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert

  settings:
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports

# Defaults are 50 per linter and 3 per identical message, which hides the rest
# of a finding class until the first three are fixed: three CI rounds to see one
# errcheck sweep. Report everything in one run instead.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
