# goreleaser configuration for agents-mcp-bridge.
#
# Targets mirror the Makefile's `cross` target exactly (linux/darwin/windows x
# amd64/arm64, six builds total). Windows builds are published as UNSUPPORTED
# PREVIEWS: the port is not done, so these binaries build and run `bridge
# doctor`-level checks but are not the supported v1.0 artifact.
#
# UNVERIFIED: this file has not been run against a real goreleaser release yet
# (no tag exists, and cosign/syft are not installed in this environment). It is
# written to the documented goreleaser v2 schema and checked here only for YAML
# validity, not by an actual `goreleaser release --snapshot` run. Treat the
# signing and SBOM stanzas as configured-but-unverified until a release is
# actually cut.

version: 2

project_name: bridge

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: bridge
    main: ./cmd/bridge
    binary: bridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # No linux/386, darwin/386 etc: the six targets below are exactly the
    # Makefile `cross` list (linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
    # windows/amd64 windows/arm64).
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: bridge
    ids:
      - bridge
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      {{- if eq .Os "windows" }}_UNSUPPORTED-PREVIEW{{ end }}
    files:
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# SBOM per archive. Requires `syft` on the release runner (not verified in this
# environment — no syft binary present here).
sboms:
  - id: bridge-sbom
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# Keyless cosign signing of the checksum file only, using GitHub Actions OIDC
# (no long-lived key material in CI). Every archive is listed in the checksum
# file, so signing it transitively covers them. Requires `cosign` on the
# release runner and the `id-token: write` permission on the release workflow;
# neither is verified in this environment — configured to the documented
# cosign/goreleaser integration, not exercised end to end.
signs:
  - id: bridge-cosign
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

# goreleaser OSS v2 has no provenance stanza: SLSA attestation is minted by the
# actions/attest-build-provenance step in .github/workflows/release.yml, after
# this config has produced dist/. That step needs `id-token: write` and
# `attestations: write` on the release job. Unverified in this environment for
# the same reason as the signing stanza above.
release:
  github:
    owner: OxCom
    name: agents-mcp-bridge
  prerelease: auto
  mode: replace
  header: |
    Windows binaries in this release are **unsupported previews**: the Windows
    port has not landed. They build and pass unit tests but are not the
    supported v1.0 artifact — see SECURITY.md.
  footer: |
    See CHANGELOG.md for what changed and SECURITY.md for which security
    properties are enforced (asserted by a test) versus declared.

changelog:
  disable: true # CHANGELOG.md is maintained by hand, Keep a Changelog style.
